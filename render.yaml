# Free personal/testing option: no durable observation storage.
services:
  - type: web
    name: congress-mcp-birdie
    runtime: docker
    branch: birdie/federal-digest
    plan: free
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: CONGRESS_API_KEY
        sync: false
      - key: MCP_ACCESS_TOKEN
        generateValue: true
      - key: BIRDIE_DIGEST_STATE
        value: /var/data/birdie/digest.sqlite3
      - key: BIRDIE_DIGEST_EPHEMERAL
        value: "true"
      - key: LOG_LEVEL
        value: WARNING
